# Workflow de CI usando Docker autosuficiente
# Ejecuta TODAS las pruebas dentro del contenedor Docker.
# La imagen ya incluye: Java 11, Maven, Chrome, Firefox y GeckoDriver.

name: Run Tests Selenium Java

on:
  push:
    branches:
      - main
    paths:
      - '**/*.java'
      - '**/*.xml'
      - '**/*.feature'
      - 'pom.xml'
      - 'Dockerfile'

  pull_request:
    branches:
      - main
    paths:
      - '**/*.java'
      - '**/*.xml'
      - '**/*.feature'
      - 'pom.xml'
      - 'Dockerfile'


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repositorio desde GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verificar Docker
      - name: Verify Docker installation
        run: docker --version

      # 3. Construir imagen Docker
      - name: Build Docker image
        run: docker build -t selenium-tests .

      # 4. Ejecutar pruebas dentro del contenedor
      - name: Run tests
        run: |
          # Ejecutar contenedor y esperar a que termine
          docker run --name allure-tests selenium-tests || true
          # Copiar resultados después de que el contenedor termine
          mkdir -p target/allure-results target/allure-report
          docker cp allure-tests:/app/target/allure-results/. ./target/allure-results/ 2>/dev/null || true
          docker cp allure-tests:/app/target/allure-report/. ./target/allure-report/ 2>/dev/null || true
          # Limpiar contenedor
          docker rm allure-tests > /dev/null || true

      # 5. Generar reporte Allure usando allure-cli (opcional)
      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p target/allure-report
          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
            docker run --rm -v $(pwd)/target/allure-results:/app/target/allure-results -v $(pwd)/target/allure-report:/app/target/allure-report tobix/allure-cli:latest generate /app/target/allure-results -o /app/target/allure-report --clean
          fi

      # 6. Upload Allure Results to Artifacts
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      # 7. Upload Allure Report to Artifacts
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report