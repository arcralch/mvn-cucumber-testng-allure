# Workflow de CI usando Docker autosuficiente
# Ejecuta TODAS las pruebas dentro del contenedor Docker.
# La imagen ya incluye: Java 11, Maven, Chrome, Firefox y GeckoDriver.

name: Run Tests Selenium Java

on:
  push:
    branches:
      - main
    paths:
      - '**/*.java'
      - '**/*.xml'
      - '**/*.feature'
      - 'pom.xml'
      - 'Dockerfile'

  pull_request:
    branches:
      - main
    paths:
      - '**/*.java'
      - '**/*.xml'
      - '**/*.feature'
      - 'pom.xml'
      - 'Dockerfile'


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar JDK
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Ejecutar pruebas con Maven
      - name: Run tests with Maven
        run: mvn clean test -B

      # 4. Generar reporte Allure usando allure-cli
      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p target/allure-report
          if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
            docker run --rm -v $(pwd)/target/allure-results:/app/target/allure-results -v $(pwd)/target/allure-report:/app/target/allure-report allure-framework/allure-cli:latest generate /app/target/allure-results -o /app/target/allure-report
          fi

      # 5. Upload Allure Results to Artifacts
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      # 6. Upload Allure Report to Artifacts
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report